# Operator virtual patch: GeoServer TestWfsPost SSRF (CVE-2021-40822)
# url must target the local GeoServer root (demo endpoint self-check intent)
SecRule REQUEST_URI "@contains /geoserver/TestWfsPost" "id:3002,phase:2,deny,status:403,log,chain,msg:'TestWfsPost url not local (CVE-2021-40822)'"
	SecRule ARGS:url "!@beginsWith http://127.0.0.1:18382/geoserver" "t:none"
