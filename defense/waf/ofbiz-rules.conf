# Operator virtual patch: OFBiz CVE-2024-45507 (SSRF -> Groovy RCE)
SecRule REQUEST_URI "@contains StatsSinceStart" "id:3003,phase:2,deny,status:403,log,chain,msg:'OFBiz statsDecoratorLocation external URL (CVE-2024-45507)'"
	SecRule ARGS:statsDecoratorLocation "@rx (?i)^https?://" "t:none"

# 2026-10-14 hardening after sister-entry bypass (findTemporalExpression + tempExprDecoratorLocation).
# 3003 anchored one entry string + one param name + http(s) prefix only -> bypassed.
# New anchor = vulnerability class, not surface:
#  3005: ANY parameter whose NAME ends in "DecoratorLocation" must not carry an absolute
#        URL of any scheme (http/https/ftp/...) nor a protocol-relative "//host" value.
#  3006: on the two known vulnerable routes, ANY parameter carrying an absolute or
#        protocol-relative URL is denied (covers unknown sister param names).
SecRule ARGS:/(?i)decoratorlocation$/ "@rx (?i)^(?:[a-z][a-z0-9+.\-]*:|//)" "id:3005,phase:2,deny,status:403,log,t:urlDecodeUni,msg:'OFBiz decorator-location family param carries external URL (CVE-2024-45507)'"

SecRule REQUEST_URI "@rx (?i)(StatsSinceStart|findTemporalExpression)" "id:3006,phase:2,deny,status:403,log,chain,t:urlDecodeUni,msg:'OFBiz CVE-2024-45507 route: absolute URL in any parameter'"
	SecRule ARGS "@rx (?i)^(?:[a-z][a-z0-9+.\-]*:|//)" "t:urlDecodeUni"
